<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker de Magos Elementais</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Tela de Seleção de Elemento -->
        <div id="selection-screen" class="screen">
            <h1>Escolha seu Elemento</h1>
            <div class="element-grid">
                <button class="element-btn" data-element="fogo" style="--btn-color: #ff4500;">Fogo</button>
                <button class="element-btn" data-element="agua" style="--btn-color: #1e90ff;">Água</button>
                <button class="element-btn" data-element="ar" style="--btn-color: #00fa9a;">Ar</button>
                <button class="element-btn" data-element="eletricidade" style="--btn-color: #ffd700;">Eletricidade</button>
                <button class="element-btn" data-element="terra" style="--btn-color: #8b4513;">Terra</button>
                <button class="element-btn" data-element="luz" style="--btn-color: #ffffff; color: #000;">Luz</button>
            </div>
        </div>

        <!-- Tela do Jogo Principal -->
        <div id="game-screen" class="screen hidden">
            <header>
                <div class="stats">
                    <div class="stat-column">
                        <p>Nv: <span id="level-display">1</span></p>
                        <p>XP: <span id="xp-display">0</span>/<span id="xp-max-display">100</span></p>
                    </div>
                    <div class="stat-column">
                        <p>Mana: <span id="mana-display">0</span></p>
                        <p>Mana/s: <span id="mana-per-sec-display">0</span></p>
                    </div>
                    <div class="stat-column">
                        <p>Diamantes: <span id="diamonds-display" style="color: #00ffff;">0</span></p>
                        <p>Prestige: <span id="prestige-display">1</span>x</p>
                    </div>
                </div>
                <div class="rebirth-container">
                    <button id="rebirth-btn" disabled>Renascer</button>
                    <div class="rebirth-progress-bg">
                        <div id="rebirth-progress-bar"></div>
                    </div>
                    <p id="rebirth-percentage">0%</p>
                    <button id="hard-reset-btn" onclick="hardReset()" style="margin-top: 5px; background: #880000; font-size: 0.6rem; padding: 5px;">Reiniciar Tudo</button>
                </div>
            </header>

            <main>
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                </div>

                <aside class="sidebar">
                    <div class="tabs">
                        <button class="tab-btn active" data-target="loja">Loja</button>
                        <button class="tab-btn" data-target="quests">Quests</button>
                        <button class="tab-btn" data-target="caixas">Caixas</button>
                        <button class="tab-btn" data-target="inventario">Inv.</button>
                        <button class="tab-btn" data-target="aventuras">Aventuras</button>
                    </div>

                    <div id="loja-tab" class="tab-content active">
                        <div class="mana-converter" style="margin-bottom: 20px; padding: 10px; background: #222; border: 2px solid #555; text-align: center;">
                            <h4 style="color: #00ffff; font-size: 10px; margin-bottom: 10px;">Conversor de Mana</h4>
                            <p style="font-size: 8px; color: #aaa; margin-bottom: 10px;">Converta 1 Milhão de Mana em 10 Diamantes.</p>
                            <button onclick="converterManaEmDiamantes()" style="width: 100%; padding: 10px; background: #008888; color: white; border: 2px solid #00ffff; font-family: 'Press Start 2P', cursive; font-size: 8px; cursor: pointer;">Converter</button>
                        </div>
                        <h3 style="margin-bottom: 10px; color: #ffd700;">Upgrades</h3>
                        <div id="upgrades-container">
                            <!-- Upgrades vão aqui via JS -->
                        </div>
                    </div>

                    <div id="quests-tab" class="tab-content">
                        <div id="quests-container">
                            <!-- Quests via JS -->
                        </div>
                    </div>

                    <div id="caixas-tab" class="tab-content">
                        <div id="caixas-container">
                            <!-- Lootboxes via JS -->
                        </div>
                    </div>

                    <div id="inventario-tab" class="tab-content">
                        <div class="inv-controls" style="margin-bottom: 10px;">
                            <label style="font-size: 0.7rem;">Filtrar: </label>
                            <select id="inv-filter" onchange="renderizarInventario()" style="background: #222; color: #fff; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; padding: 5px; border: 1px solid #444;">
                                <option value="rarity">Raridade</option>
                                <option value="alpha">Alfabética</option>
                            </select>
                        </div>
                        <h3>Equipados</h3>
                        <div id="equipados-container" class="inv-grid">
                            <!-- Equipados via JS -->
                        </div>
                        <h3 style="margin-top: 15px;">Mochila</h3>
                        <div id="mochila-container" class="inv-grid">
                            <!-- Mochila via JS -->
                        </div>
                    </div>

                    <div id="aventuras-tab" class="tab-content">
                        <div id="aventuras-container">
                            <!-- Aventuras via JS -->
                        </div>
                        <button id="btn-leave-adventure" class="hidden" style="margin-top: 20px; width: 100%; padding: 10px; background: #555; color: white;" onclick="sairAventura()">Fugir da Batalha</button>
                    </div>
                </aside>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
