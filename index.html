<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker de Magos Elementais</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Tela de Seleção de Elemento -->
        <div id="selection-screen" class="screen">
            <h1>Escolha seu Elemento</h1>
            <div class="element-grid">
                <button class="element-btn" data-element="fogo" style="--btn-color: #ff4500;">Fogo</button>
                <button class="element-btn" data-element="agua" style="--btn-color: #1e90ff;">Água</button>
                <button class="element-btn" data-element="ar" style="--btn-color: #00fa9a;">Ar</button>
                <button class="element-btn" data-element="eletricidade" style="--btn-color: #ffd700;">Eletricidade</button>
                <button class="element-btn" data-element="terra" style="--btn-color: #8b4513;">Terra</button>
                <button class="element-btn" data-element="luz" style="--btn-color: #ffffff; color: #fff;">Luz</button>
            </div>
        </div>

        <!-- Tela do Jogo Principal -->
        <div id="game-screen" class="screen hidden">
            <header>
                <div class="stats">
                    <div class="stat-column">
                        <p>Nv: <span id="level-display">1</span></p>
                        <p>XP: <span id="xp-display">0</span>/<span id="xp-max-display">100</span></p>
                    </div>
                    <div class="stat-column">
                        <p>Mana: <span id="mana-display">0</span></p>
                        <p>Mana/s: <span id="mana-per-sec-display">0</span></p>
                    </div>
                    <div class="stat-column">
                        <p>Diamantes: <span id="diamonds-display" style="color: #00ffff;">0</span></p>
                        <p>Prestige: <span id="prestige-display">1</span>x</p>
                    </div>
                </div>
                <div class="rebirth-container">
                    <button id="rebirth-btn" disabled>Renascer</button>
                    <div class="rebirth-progress-bg">
                        <div id="rebirth-progress-bar"></div>
                    </div>
                    <p id="rebirth-percentage">0%</p>
                </div>
            </header>

            <main>
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                </div>

                <aside class="sidebar">
                    <div class="tabs">
                        <button class="tab-btn active" data-target="loja">Loja</button>
                        <button class="tab-btn" data-target="quests">Quests</button>
                        <button class="tab-btn" data-target="caixas">Caixas</button>
                    </div>

                    <div id="loja-tab" class="tab-content active">
                        <div id="upgrades-container">
                            <!-- Upgrades vão aqui via JS -->
                        </div>
                    </div>

                    <div id="quests-tab" class="tab-content">
                        <div id="quests-container">
                            <!-- Quests via JS -->
                        </div>
                    </div>

                    <div id="caixas-tab" class="tab-content">
                        <div id="caixas-container">
                            <!-- Lootboxes via JS -->
                        </div>
                        <div class="skins-inventory">
                            <h3>Skins</h3>
                            <div id="skins-container">
                                <!-- Inventário de skins -->
                            </div>
                        </div>
                    </div>
                </aside>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
