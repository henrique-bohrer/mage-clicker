<!DOCTYPE html>
<html>
<head>
<style>
  body { background-color: #111; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  canvas { background-color: #0a0a0a; border: 1px solid #333; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="800"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const C = '#1e90ff'; // Blue element
const D = '#0000cc'; // Dark blue (for shadows/outlines)
const L = '#ff0000'; // Red (element particle/staff top)
const Y = '#ffd700'; // Yellow (hat band / staff accent)
const S = '#f4a460'; // Skin
const W = '#ffffff'; // White (beard)
const B = '#000000'; // Black (eyes/dark parts)
const X = null;

const RC = C, HC = C, SC = '#3e2723', RH = Y, HH = Y, SH = L, RC_D = D, HC_D = D, SC_D = '#1e110c';

// The original image is quite tall. Let's make a matrix that fits it. We might need a slightly larger matrix, like 24x24 or 32x32 to get this detail. Let's try to fit the core into a 32x32 to be safe and give us room for the tall hat and staff.

const grid = [];
for(let i=0; i<32; i++) grid.push(new Array(32).fill(X));

// Let's roughly map the new image to a 32x32 grid.
// Hat (Top to bottom)
grid[4][14] = HC; grid[4][15] = HC; grid[4][16] = HC; grid[4][17] = HC; grid[4][18] = HC;
grid[5][12] = HC; grid[5][13] = HC; grid[5][14] = HC; grid[5][15] = HC; grid[5][16] = HC; grid[5][17] = HC;
grid[6][15] = HC; grid[6][16] = HC; grid[6][17] = HC; grid[6][18] = HC;
grid[7][15] = HC; grid[7][16] = HC; grid[7][17] = HC; grid[7][18] = HC; grid[7][19] = HC;
grid[8][15] = HC; grid[8][16] = HC; grid[8][17] = HC; grid[8][18] = HC; grid[8][19] = HC;
grid[9][14] = HC; grid[9][15] = HC; grid[9][16] = HC; grid[9][17] = HC; grid[9][18] = HC; grid[9][19] = HC; grid[9][20] = HC;
// Hat yellow band
grid[10][14] = B; grid[10][15] = Y; grid[10][16] = Y; grid[10][17] = Y; grid[10][18] = Y; grid[10][19] = B; grid[10][20] = B;
grid[11][14] = B; grid[11][15] = Y; grid[11][16] = Y; grid[11][17] = Y; grid[11][18] = Y; grid[11][19] = B; grid[11][20] = B;
// Hat brim
for(let x=10; x<=24; x++) grid[12][x] = HC;

// Face
for(let x=13; x<=21; x++) grid[13][x] = S;
grid[14][13]=S; grid[14][14]=S; grid[14][15]=B; grid[14][16]=S; grid[14][17]=S; grid[14][18]=S; grid[14][19]=B; grid[14][20]=S; grid[14][21]=S;
for(let x=13; x<=21; x++) grid[15][x] = S;

// Beard (White and light gray/shadows)
for(let x=13; x<=21; x++) grid[16][x] = W;
for(let x=13; x<=21; x++) grid[17][x] = W;
grid[18][14]=W; grid[18][15]=W; grid[18][16]=W; grid[18][17]=W; grid[18][18]=W; grid[18][19]=W; grid[18][20]=W;
grid[19][15]=W; grid[19][16]=W; grid[19][17]=W; grid[19][18]=W; grid[19][19]=W;
grid[20][16]=W; grid[20][17]=W; grid[20][18]=W;
grid[21][16]=W; grid[21][17]=W; grid[21][18]=W;

// Robe
grid[18][13]=RC; grid[18][21]=RC;
grid[19][12]=RC; grid[19][13]=RC; grid[19][20]=RC; grid[19][21]=RC;
grid[20][12]=RC; grid[20][13]=RC; grid[20][14]=RC; grid[20][19]=RC; grid[20][20]=RC; grid[20][21]=RC;
grid[21][13]=RC; grid[21][14]=RC; grid[21][15]=RC; grid[21][19]=RC; grid[21][20]=RC; grid[21][21]=RC;
// body of robe
for(let y=22; y<=30; y++) {
  grid[y][14]=RC; grid[y][15]=RC; grid[y][19]=RC; grid[y][20]=RC;
  // Yellow middle stripe
  grid[y][17] = Y;
  grid[y][16] = RC_D; grid[y][18] = RC_D; // darker blue for depth
}
// Arm connection to staff (left side)
grid[21][11]=RC; grid[21][12]=RC;
grid[22][11]=RC; grid[22][12]=RC;

// Hand holding staff
grid[21][9]=S; grid[21][10]=S;
grid[22][9]=S; grid[22][10]=S;

// Feet
grid[31][13]=RC; grid[31][14]=RC; grid[31][15]=RC;
grid[31][19]=RC; grid[31][20]=RC; grid[31][21]=RC;

// Staff
for(let y=10; y<=31; y++) {
  grid[y][8] = SC; grid[y][9] = SC;
}
// the staff zig-zag
grid[15][8] = X; grid[15][10] = SC;
grid[16][8] = X; grid[16][10] = SC;
grid[17][8] = X; grid[17][10] = SC;

// Staff top
grid[8][8]=Y; grid[8][9]=Y;
grid[9][8]=Y; grid[9][9]=Y;
for(let x=7; x<=10; x++) { grid[6][x]=L; grid[7][x]=L; }

// Magical particles
grid[2][8]=L; grid[3][8]=L; grid[2][9]=L; grid[3][9]=L;
grid[4][5]=L; grid[5][5]=L; grid[4][6]=L; grid[5][6]=L;
grid[2][12]=L; grid[3][12]=L; grid[2][13]=L; grid[3][13]=L;
grid[6][12]=L; grid[7][12]=L; grid[6][13]=L; grid[7][13]=L;

const ps = 20;
const offsetX = 400 - 16*ps;
const offsetY = 400 - 16*ps;

function drawLayer(layer) {
    for (let y = 0; y < 32; y++) {
        for (let x = 0; x < 32; x++) {
            if (layer[y][x]) {
                ctx.fillStyle = layer[y][x];
                ctx.fillRect(offsetX + x*ps, offsetY + y*ps, ps, ps);
            }
        }
    }
}

drawLayer(grid);

</script>
</body>
</html>
